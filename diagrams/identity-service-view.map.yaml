- id: verifiers
  label: JWKS verifiers
  kind: annotation
  role: inbound
  row: 442
  evidence:
  - path: docs/user_stories.md
    quote: Given the service is running, when the JWKS endpoint is fetched, then it
      returns the current and next public keys in standard JWKS form, unauthenticated.
  - path: docs/architecture.md
    quote: publishes current + next public keys at `GET /.well-known/jwks.json` so
      every peer verifies tokens **locally** (no runtime call to this service).
- id: svc
  name: identity_service
  label: identity_service
  kind: service
  technology: kubernetes-pod
  role: service
  row: 260
  evidence:
  - path: docs/architecture.md
    quote: '**Statelessness:** all state lives in PostgreSQL; no local disk or in-memory
      session state. Safe with `replicas >= 1`;'
  - path: docs/architecture.md
    quote: '`identity_service` owns everything about **who a user is and how they
      prove it**:'
- id: db
  label: identity PostgreSQL
  kind: database
  technology: postgresql
  role: outbound
  row: 313
  evidence:
  - path: docs/architecture.md
    quote: All tables are owned by this service.
  - path: docs/architecture.md
    quote: PostgreSQL Database Schema
- id: resend
  label: Resend email provider
  kind: annotation
  external: true
  external_role: dependency
  role: outbound
  row: 355
  evidence:
  - path: docs/architecture.md
    quote: Outbound only; **no inbound webhook at launch**.
  - path: docs/architecture.md
    quote: 'Emails: verification (on register / resend), password reset, password-changed
      confirmation.'
- id: events
  name: identity_events
  label: Kafka
  kind: broker
  technology: kafka
  role: outbound
  row: 70
  evidence:
  - path: docs/architecture.md
    quote: 'Topic **`identity_events`**, key = `user_id`, event **`user_account_changed`
      (EVT-001)**, published on: email verification, display-name update, email change,
      deactivation.'
  - path: docs/architecture.md
    quote: Producer `identity_service`, consumer `notification_service`, topic `identity_events`,
      key `user_id`; delivery at-least-once, consumers dedupe on `envelope.event_id`
      and apply only if `account_version` is newer.
