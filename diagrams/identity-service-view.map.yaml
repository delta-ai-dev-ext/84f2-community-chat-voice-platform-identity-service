- id: r-db
  source: svc
  target: db
  type: ownership
  evidence:
  - path: docs/architecture.md
    quote: All tables are owned by this service.
  - path: docs/architecture.md
    quote: '**Statelessness:** all state lives in PostgreSQL; no local disk or in-memory
      session state. Safe with `replicas >= 1`;'
- id: r-resend
  source: svc
  target: resend
  type: request
  interaction:
    channel: direct
    purpose: transactional email delivery
    exchange_id: resend-send
  evidence:
  - path: docs/architecture.md
    quote: 'Emails: verification (on register / resend), password reset, password-changed
      confirmation.'
  - path: docs/architecture.md
    quote: 'Failures: bounded exponential back-off on transient errors (429/5xx);
      on final failure the user-facing flow returns "we couldn''t send the email,
      try again" (`503 email_unavailable`) and the token is not consumed'
- id: r-produce
  source: svc
  target: events
  type: event
  direction: forward
  interaction:
    channel: messaging
    purpose: account change notification
    protocol: Kafka
  messaging:
    role: producer
    topic: identity_events
  evidence:
  - path: docs/architecture.md
    quote: Asynchronous flows (Kafka producer)
  - path: docs/architecture.md
    quote: Producer `identity_service`, consumer `notification_service`, topic `identity_events`,
      key `user_id`; delivery at-least-once, consumers dedupe on `envelope.event_id`
      and apply only if `account_version` is newer.
  - path: docs/architecture.md
    quote: Publishing happens **after** the PostgreSQL transaction commits (transactional
      outbox, §4); a failed publish is retried (at-least-once).
