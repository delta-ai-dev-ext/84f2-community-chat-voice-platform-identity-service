  source: verifiers
  target: svc
  type: request
  interaction:
    channel: direct
    purpose: token verification key fetch
    protocol: HTTP
    exchange_id: jwks-fetch
  evidence:
  - path: docs/architecture.md
    quote: Synchronous HTTP flows
  - path: docs/user_stories.md
    quote: Given the service is running, when the JWKS endpoint is fetched, then it
